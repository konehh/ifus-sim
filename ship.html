<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim — Ship a project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfcfe; --card:#ffffff; --ink:#1a1d29; --ink2:#5b6075; --ink3:#9498ab;
  --line:#eceefa; --line2:#e2e5f5;
  --blue:#4f7cff; --blue-soft:#eef2ff; --blue-ink:#2950d4;
  --purple:#9b6dff; --purple-soft:#f4eeff; --purple-ink:#6f42cc;
  --green:#2bb673; --green-soft:#e8f7f0; --green-ink:#1a8a55;
  --radius:18px; --shadow:0 1px 2px rgba(26,29,41,.04),0 8px 24px rgba(60,80,180,.06);
  --shadow-lift:0 4px 12px rgba(26,29,41,.06),0 16px 40px rgba(60,80,180,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bgmesh{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(55% 40% at 15% 0%,rgba(79,124,255,.06),transparent 70%),
  radial-gradient(50% 40% at 88% 4%,rgba(155,109,255,.06),transparent 70%);pointer-events:none}
.wrap{max-width:720px;margin:0 auto;padding:0 24px 90px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:26px 0}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:Sora,sans-serif;font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.3px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:inline-block}
nav{display:flex;gap:8px}
nav a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:10px;transition:all .15s}
nav a:hover{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--green-ink);background:var(--green-soft);border-radius:30px;padding:7px 16px;margin:18px 0 22px}
.eyebrow .pdot{width:6px;height:6px;border-radius:50%;background:var(--green)}
h1{font-family:Sora,sans-serif;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-1.2px;margin-bottom:12px}
.lede{color:var(--ink2);font-size:17px;max-width:520px;margin-bottom:34px;line-height:1.55}
.formcard{background:var(--card);border-radius:22px;padding:32px;box-shadow:var(--shadow)}
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:var(--ink);margin-bottom:7px;font-weight:500}
.field label .req{color:var(--green-ink);font-weight:500}
.field label .opt{color:var(--ink3);font-weight:400}
.field input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:12px 15px;color:var(--ink);font-family:inherit;font-size:14.5px;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--blue)}
.field .hint{font-size:12.5px;color:var(--ink3);margin-top:6px}
.two{display:flex;gap:14px}.two .field{flex:1}
.divide{border-top:1px solid var(--line);margin:24px 0}
.foot{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.addbtn{background:var(--green);color:#fff;border:none;font-family:inherit;font-weight:600;font-size:15px;padding:13px 26px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;box-shadow:0 4px 14px rgba(43,182,115,.3);transition:all .15s}
.addbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(43,182,115,.4)}
.addbtn:disabled{opacity:.4;cursor:default;box-shadow:none}
.gate{font-size:13px;color:var(--ink3)}
@media(max-width:560px){h1{font-size:30px}.two{flex-direction:column;gap:0}.formcard{padding:22px}}
</style>
</head>
<body>
<div class="bgmesh"></div>
<div class="wrap">
  <header class="top">
    <span class="brand"><span class="mark"></span>Sim</span>
    <nav><a href="index.html">Home</a><a href="ladder.html">Ladder</a><a href="portfolio.html">Portfolio</a></nav>
  </header>

  <span class="eyebrow"><span class="pdot"></span>Ship &amp; show</span>
  <h1>Ship a project</h1>
  <p class="lede">Add something you built to your portfolio. It becomes a shareable story. No upload — just paste where your work lives.</p>

  <div class="formcard">
    <div class="field"><label>Project title</label><input id="f-title" placeholder="e.g. Loyalty points service for a coffee chain" oninput="checkGate()"></div>
    <div class="field"><label>One-line outcome</label><input id="f-out" placeholder="What changed because of this project?"></div>
    <div class="two">
      <div class="field"><label>Archetype</label><input id="f-arch" placeholder="e.g. Build-type · integration"></div>
      <div class="field"><label>Sector</label><input id="f-sector" placeholder="e.g. Logistics / Shipping"></div>
    </div>
    <div class="field"><label>Tech stack</label><input id="f-stack" placeholder="e.g. C#, .NET 8, EF Core, SQL Server"><div class="hint">Comma-separated list of technologies.</div></div>
    <div class="divide"></div>
    <div class="field"><label>Repository link <span class="req">— required</span></label><input id="f-repo" placeholder="https://github.com/..." oninput="checkGate()"></div>
    <div class="field"><label>Live demo link <span class="opt">(optional)</span></label><input id="f-live" placeholder="https://..."></div>
    <div class="foot">
      <button class="addbtn" id="addbtn" disabled onclick="submitProject()">+ Add to portfolio</button>
      <span class="gate">No repo link = can't ship.</span>
    </div>
  </div>
</div>

<script>
function checkGate(){
  var repo=document.getElementById('f-repo').value.trim();
  var title=document.getElementById('f-title').value.trim();
  document.getElementById('addbtn').disabled=!(repo&&title);
}
function submitProject(){
  var stackRaw=document.getElementById('f-stack').value.trim();
  var project={
    title:document.getElementById('f-title').value.trim(),
    out:document.getElementById('f-out').value.trim()||'Shipped.',
    arch:document.getElementById('f-arch').value.trim()||'Build-type',
    sector:document.getElementById('f-sector').value.trim(),
    stack:stackRaw?stackRaw.split(',').map(function(s){return s.trim();}).filter(Boolean):[],
    repo:document.getElementById('f-repo').value.trim(),
    live:document.getElementById('f-live').value.trim()
  };
  try{ sessionStorage.setItem('sim_new_project', JSON.stringify(project)); }catch(e){}
  window.location.href='portfolio.html';
}
</script>
</body>
</html>
