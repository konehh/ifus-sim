<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim — Project Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfcfe; --card:#ffffff; --ink:#1a1d29; --ink2:#5b6075; --ink3:#9498ab;
  --line:#eceefa; --line2:#e2e5f5;
  --blue:#4f7cff; --blue-soft:#eef2ff; --blue-ink:#2950d4;
  --purple:#9b6dff; --purple-soft:#f4eeff; --purple-ink:#6f42cc;
  --green:#2bb673; --green-soft:#e8f7f0; --green-ink:#1a8a55;
  --amber:#e0922f; --amber-soft:#fdf3e3; --amber-ink:#b5701a;
  --coral:#f0654f; --coral-soft:#fdecea; --coral-ink:#c8472f;
  --radius:18px; --shadow:0 1px 2px rgba(26,29,41,.04),0 8px 24px rgba(60,80,180,.06);
  --shadow-lift:0 4px 12px rgba(26,29,41,.06),0 16px 40px rgba(60,80,180,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bgmesh{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(55% 40% at 15% 0%,rgba(79,124,255,.06),transparent 70%),
  radial-gradient(50% 40% at 90% 3%,rgba(155,109,255,.06),transparent 70%);pointer-events:none}
.wrap{max-width:900px;margin:0 auto;padding:0 24px 90px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:26px 0}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:Sora,sans-serif;font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.3px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:inline-block}
nav{display:flex;gap:8px}
nav a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:10px;transition:all .15s}
nav a:hover,nav a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pagehead{padding:24px 0 8px}
h1{font-family:Sora,sans-serif;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-1.2px;margin-bottom:12px}
h1 .grad{background:linear-gradient(120deg,var(--blue),var(--purple) 60%,var(--green));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--ink2);font-size:17px;max-width:580px;line-height:1.55}
.controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin:32px 0 20px}
.count{color:var(--ink3);font-size:13px;letter-spacing:.3px}
.sort{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.sort button{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:500;padding:7px 15px;border-radius:9px;cursor:pointer;transition:all .15s}
.sort button.on{background:var(--blue);color:#fff}
.card{background:var(--card);border-radius:var(--radius);padding:24px 26px;margin-bottom:16px;box-shadow:var(--shadow);transition:all .18s;border-left:5px solid var(--line2)}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.card.edge-warmup{border-left-color:var(--green)}
.card.edge-core{border-left-color:var(--blue)}
.card.edge-hard{border-left-color:var(--amber)}
.card.edge-brutal{border-left-color:var(--coral)}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:.1px}
.pill.arch{font-weight:500}
.pill.sector{background:var(--bg);color:var(--ink3);font-weight:450}
.t-warmup{background:var(--green-soft);color:var(--green-ink)}
.t-core{background:var(--blue-soft);color:var(--blue-ink)}
.t-hard{background:var(--amber-soft);color:var(--amber-ink)}
.t-brutal{background:var(--coral-soft);color:var(--coral-ink)}
.a-build{background:var(--blue-soft);color:var(--blue-ink)}
.a-polish{background:var(--purple-soft);color:var(--purple-ink)}
.a-debug{background:var(--amber-soft);color:var(--amber-ink)}
.a-rescue{background:var(--coral-soft);color:var(--coral-ink)}
.a-ai{background:var(--green-soft);color:var(--green-ink)}
.a-architect{background:var(--purple-soft);color:var(--purple-ink)}
.a-unfixable{background:var(--coral-soft);color:var(--coral-ink)}
.a-capstone{background:linear-gradient(120deg,var(--blue-soft),var(--purple-soft));color:var(--purple-ink)}
.card h2{font-family:Sora,sans-serif;font-weight:600;font-size:22px;line-height:1.25;margin-bottom:8px;letter-spacing:-.4px}
.card .sm{color:var(--ink2);font-size:15px;margin-bottom:16px;line-height:1.55}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.badge{font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid var(--line2);padding:3px 10px;border-radius:7px;font-weight:450}
.viewbrief{margin-top:18px;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:inherit;font-size:14px;font-weight:500;padding:9px 18px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.viewbrief:hover{border-color:var(--blue);color:var(--blue-ink)}
.viewbrief .chev{transition:transform .25s;font-size:11px}
.viewbrief.open .chev{transform:rotate(180deg)}
.brief{max-height:0;overflow:hidden;transition:max-height .4s ease}
.brief.open{max-height:3000px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.brief h3{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--blue-ink);margin:20px 0 10px;font-weight:600}
.brief h3:first-child{margin-top:0}
.brief p{color:var(--ink2);font-size:14.5px;margin-bottom:6px;line-height:1.6}
.brief ul{list-style:none}
.brief li{color:var(--ink2);font-size:14.5px;padding-left:20px;position:relative;margin-bottom:7px;line-height:1.55}
.brief li:before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.scope{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.scope div{flex:1;min-width:230px;border-radius:12px;padding:15px 17px}
.scope .effort{background:var(--blue-soft)}
.scope .costr{background:var(--purple-soft)}
.scope .lab{font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.scope .effort .lab{color:var(--blue-ink)}.scope .costr .lab{color:var(--purple-ink)}
.scope .val{font-size:14px;color:var(--ink2);line-height:1.5}
.stretch{background:var(--green-soft);border-radius:12px;padding:13px 16px;font-size:14px;color:var(--green-ink);margin-top:12px}
.stretch b{font-weight:600}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:38px;flex-wrap:wrap}
.pager button{background:var(--card);border:none;color:var(--ink2);font-family:inherit;font-size:14px;font-weight:500;min-width:42px;height:42px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow);transition:all .15s}
.pager button:hover:not(:disabled){color:var(--blue-ink);transform:translateY(-2px)}
.pager button.on{background:var(--blue);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
@media(max-width:560px){h1{font-size:30px}.card{padding:20px}.scope div{min-width:100%}}
</style>
</head>
<body>
<div class="bgmesh"></div>
<div class="wrap">
  <header class="top">
    <span class="brand"><span class="mark"></span>Sim</span>
    <nav><a href="index.html">Home</a><a href="ladder.html" class="on">Ladder</a><a href="portfolio.html">Portfolio</a></nav>
  </header>

  <div class="pagehead">
    <h1>The project <span class="grad">ladder</span></h1>
    <p class="sub">Real company-style briefs built from your stack — from warm-up to brutal. Each one is done only when there's a repo, a demo, and a write-up.</p>
  </div>

  <div class="controls">
    <span class="count" id="count"></span>
    <div class="sort">
      <button id="s-latest" class="on" onclick="setSort('latest')">Latest</button>
      <button id="s-diff" onclick="setSort('difficulty')">Difficulty</button>
    </div>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager"></div>
</div>

<script src="projects.js"></script>
<script>
var PER_PAGE=10, page=1, sort='latest';
var tierClass={'Warm-up':'t-warmup','Core':'t-core','Hard':'t-hard','Brutal':'t-brutal'};
var edgeClass={'Warm-up':'edge-warmup','Core':'edge-core','Hard':'edge-hard','Brutal':'edge-brutal'};
var tierRank={'Warm-up':0,'Core':1,'Hard':2,'Brutal':3};
function ordered(){
  var a=PROJECTS.slice();
  if(sort==='latest'){a.sort(function(x,y){return y.n-x.n});}
  else{a.sort(function(x,y){return tierRank[x.tier]-tierRank[y.tier]||x.n-y.n});}
  return a;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  var all=ordered();
  var pages=Math.ceil(all.length/PER_PAGE);
  if(page>pages)page=pages;
  var start=(page-1)*PER_PAGE;
  var slice=all.slice(start,start+PER_PAGE);
  document.getElementById('count').textContent=all.length+' projects · page '+page+' of '+pages;
  var html='';
  slice.forEach(function(p){
    var badges=p.stack.map(function(s){return '<span class="badge">'+esc(s)+'</span>';}).join('');
    var builds=p.builds.map(function(b){return '<li>'+esc(b)+'</li>';}).join('');
    var accept=p.accept.map(function(b){return '<li>'+esc(b)+'</li>';}).join('');
    var qs=p.questions.map(function(b){return '<li>'+esc(b)+'</li>';}).join('');
    html+='<div class="card '+edgeClass[p.tier]+'">'+
      '<div class="pills">'+
        '<span class="pill '+tierClass[p.tier]+'">'+esc(p.tier)+'</span>'+
        '<span class="pill arch a-'+p.archetypeKey+'">'+esc(p.archetype)+'</span>'+
        '<span class="pill sector">'+esc(p.sector)+'</span>'+
      '</div>'+
      '<h2>'+esc(p.title)+'</h2>'+
      '<p class="sm">'+esc(p.summary)+'</p>'+
      '<div class="badges">'+badges+'</div>'+
      '<button class="viewbrief" onclick="toggle(this)">View brief <span class="chev">&#9662;</span></button>'+
      '<div class="brief">'+
        '<h3>The brief</h3><p>'+esc(p.brief)+'</p>'+
        '<h3>What he builds</h3><ul>'+builds+'</ul>'+
        '<div class="scope">'+
          '<div class="effort"><div class="lab">Effort</div><div class="val">'+esc(p.effort)+'</div></div>'+
          '<div class="costr"><div class="lab">Cost &amp; resources</div><div class="val">'+esc(p.cost)+'</div></div>'+
        '</div>'+
        '<h3>Acceptance checklist</h3><ul>'+accept+'</ul>'+
        '<h3>Questions a delivery manager will ask</h3><ul>'+qs+'</ul>'+
        '<div class="stretch"><b>Stretch:</b> '+esc(p.stretch)+'</div>'+
      '</div>'+
    '</div>';
  });
  document.getElementById('list').innerHTML=html;
  var pg='<button onclick="go('+(page-1)+')"'+(page===1?' disabled':'')+'>&#8249;</button>';
  for(var i=1;i<=pages;i++){pg+='<button class="'+(i===page?'on':'')+'" onclick="go('+i+')">'+i+'</button>';}
  pg+='<button onclick="go('+(page+1)+')"'+(page===pages?' disabled':'')+'>&#8250;</button>';
  document.getElementById('pager').innerHTML=pg;
}
function toggle(btn){btn.classList.toggle('open');btn.nextElementSibling.classList.toggle('open');}
function go(p){var pages=Math.ceil(PROJECTS.length/PER_PAGE);if(p<1||p>pages)return;page=p;render();window.scrollTo({top:0,behavior:'smooth'});}
function setSort(s){sort=s;page=1;document.getElementById('s-latest').classList.toggle('on',s==='latest');document.getElementById('s-diff').classList.toggle('on',s==='difficulty');render();}
render();
</script>
</body>
</html>
